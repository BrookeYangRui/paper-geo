name: Monitor repository traffic and site health

on:
  schedule:
    # GitHub traffic endpoints expose a rolling 14-day window. A daily snapshot
    # makes changes visible before they fall out of that window.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Collect repository traffic and public endpoint health
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SITE_URL: https://brookeyangrui.github.io/paper-geo
        run: |
          set -eu
          mkdir -p monitoring

          traffic_available=false
          if [ -n "$TRAFFIC_TOKEN" ]; then
            GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/${REPOSITORY}/traffic/views" > monitoring/views.json
            GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/${REPOSITORY}/traffic/clones" > monitoring/clones.json
            GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/${REPOSITORY}/traffic/popular/referrers" > monitoring/referrers.json
            GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/${REPOSITORY}/traffic/popular/paths" > monitoring/paths.json
            traffic_available=true
          else
            echo '{"count":null,"uniques":null,"views":[]}' > monitoring/views.json
            echo '{"count":null,"uniques":null,"clones":[]}' > monitoring/clones.json
            echo '[]' > monitoring/referrers.json
            echo '[]' > monitoring/paths.json
          fi

          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          health='[]'
          for path in / /papers/mas-security-sok.html /papers/3r-bench.html /papers/halo-host-name-poisoning.html /api/papers.json /llms.txt /sitemap.xml; do
            status=$(curl --max-time 20 --retry 2 --silent --show-error --output /dev/null --write-out '%{http_code}' "${SITE_URL}${path}")
            health=$(jq --arg path "$path" --argjson status "$status" '. + [{path:$path,status:$status}]' <<< "$health")
            if [ "$status" -ne 200 ]; then
              echo "Endpoint failed: ${path} returned ${status}" >&2
              exit 1
            fi
          done

          jq -n \
            --arg checked_at "$checked_at" \
            --arg repository "$REPOSITORY" \
            --arg site "$SITE_URL" \
            --argjson traffic_available "$traffic_available" \
            --argjson views "$(<monitoring/views.json)" \
            --argjson clones "$(<monitoring/clones.json)" \
            --argjson referrers "$(<monitoring/referrers.json)" \
            --argjson paths "$(<monitoring/paths.json)" \
            --argjson health "$health" \
            '{checked_at:$checked_at,repository:$repository,site:$site,traffic_available:$traffic_available,traffic:{views:$views,clones:$clones,referrers:$referrers,paths:$paths},health:$health}' \
            > monitoring/report.json

          {
            echo "## Paper Geo monitoring"
            echo
            echo "Checked: ${checked_at}"
            echo
            if [ "$traffic_available" = true ]; then
              echo "| Metric (rolling 14 days) | Total | Unique |"
              echo "|---|---:|---:|"
              echo "| Repository views | $(jq '.count' monitoring/views.json) | $(jq '.uniques' monitoring/views.json) |"
              echo "| Repository clones | $(jq '.count' monitoring/clones.json) | $(jq '.uniques' monitoring/clones.json) |"
              echo
            else
              echo "Repository traffic unavailable: add a fine-grained TRAFFIC_TOKEN secret with access to repository traffic."
              echo
            fi
            echo "All monitored public endpoints returned HTTP 200."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store daily snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paper-geo-monitoring-${{ github.run_id }}
          path: monitoring/
          retention-days: 90
